plugins {
    id 'java'
    id 'application'
}

group = 'com.repolens'
version = '1.0.0'

repositories {
    mavenCentral()
}

dependencies {
    implementation 'com.fasterxml.jackson.core:jackson-databind:2.20.1'
    testImplementation 'org.junit.jupiter:junit-jupiter:5.12.2'
}

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
}

application {
    mainClass = 'com.repolens.Main'
    applicationDefaultJvmArgs = ['--add-modules=jdk.httpserver']
}

tasks.withType(JavaCompile).configureEach {
    options.compilerArgs += ['--add-modules', 'jdk.httpserver']
}

test {
    useJUnitPlatform()
}